<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Movie night: secret roles</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Mrs+Saint+Delafield&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E8E3DA;
    --surface: #F5F2EC;
    --surface-2: #DDD6CA;
    --ink: #2B2520;
    --muted: #6F6358;
    --line: #C7BEB0;
    --accent: #7B4B2A;
    --on-accent: #F8F4EE;
    --focus: #7B4B2A;
    --star: #B07A1A;
    --ok: #3F6B4F;
    --on-ok: #FFFFFF;
    --note: #F2E3A4;
    --on-note: #2B2520;
    --shadow: rgba(48, 30, 14, 0.24);
    --arcs: 0.16;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1E1915;
      --surface: #29221C;
      --surface-2: #372E26;
      --ink: #F1ECE3;
      --muted: #B8AB9B;
      --line: #4B3F34;
      --accent: #D9A777;
      --on-accent: #231A12;
      --focus: #E6BE94;
      --star: #E3B04B;
      --ok: #8CC9A2;
      --on-ok: #14231A;
      --note: #6A5A2B;
      --on-note: #F7EFD6;
      --shadow: rgba(0, 0, 0, 0.5);
      --arcs: 0.2;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1E1915;
    --surface: #29221C;
    --surface-2: #372E26;
    --ink: #F1ECE3;
    --muted: #B8AB9B;
    --line: #4B3F34;
    --accent: #D9A777;
    --on-accent: #231A12;
    --focus: #E6BE94;
    --star: #E3B04B;
    --ok: #8CC9A2;
    --on-ok: #14231A;
    --note: #6A5A2B;
    --on-note: #F7EFD6;
    --shadow: rgba(0, 0, 0, 0.5);
    --arcs: 0.2;
    color-scheme: dark;
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.45 "Jost", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { position: relative; max-width: 1180px; margin: 0 auto; padding: 14px 20px 28px; overflow: hidden; }
  .wrap > *:not(.arcs) { position: relative; z-index: 1; }
  .arcs { position: absolute; top: 0; right: 0; width: min(40vw, 340px); height: auto; color: var(--accent); opacity: var(--arcs); pointer-events: none; z-index: 0; }

  h1, h2, h3 { margin: 0; font-weight: 400; }
  h1 { font-family: "Mrs Saint Delafield", "Brush Script MT", cursive; font-size: clamp(3rem, 6vw, 4.2rem); line-height: 0.85; }
  h2 { font-family: "Mrs Saint Delafield", "Brush Script MT", cursive; font-size: 2rem; line-height: 1; }
  h3 { font-family: "Oswald", "Arial Narrow", sans-serif; font-weight: 600; font-size: 0.95rem; letter-spacing: 0.06em; text-transform: uppercase; }

  /* header: title, sticky notes, scores */
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 26px; margin-bottom: 16px; }
  .stickies { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; flex: 1; min-width: 260px; }
  .sticky {
    display: flex; gap: 8px; align-items: center; max-width: 260px; padding: 7px 12px 9px;
    background: var(--note); color: var(--on-note); border-radius: 2px; box-shadow: 0 5px 12px var(--shadow);
    line-height: 1.2;
  }
  #tPlace { rotate: -1.5deg; }
  #tPower { rotate: 1.5deg; }
  .sticky .em { font-size: 1.4rem; line-height: 1; }
  .sticky .s { display: block; font: 600 0.66rem/1 "Oswald", sans-serif; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.7; margin-bottom: 3px; }
  .sticky .t { font-weight: 600; font-size: 0.95rem; }
  .sticky.land { animation: land 0.22s ease-out; }

  .board { display: flex; }
  .stat { padding: 0 16px; border-left: 1.5px solid var(--line); min-width: 78px; }
  .stat:first-child { border-left: 0; padding-left: 0; }
  .stat b { display: block; font: 600 1.7rem/1 "Oswald", sans-serif; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 0.82rem; color: var(--muted); }

  /* buttons */
  .btn {
    font: 600 1rem "Jost", sans-serif; border: 2px solid transparent; border-radius: 10px; padding: 8px 16px;
    background: var(--ink); color: var(--bg); cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn.big { font-size: 1.1rem; padding: 11px 26px; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  /* table: posters on the left, secret cards on the right */
  .stage { display: grid; gap: 20px; }
  .table { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 26px; align-items: start; }
  .left-col { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .choice { display: flex; align-items: center; gap: 4px; }
  .or { font-family: "Mrs Saint Delafield", cursive; font-size: 2.4rem; color: var(--muted); line-height: 1; }
  .poster {
    margin: 0; width: clamp(130px, 15vw, 190px); background: var(--surface); padding: 5px 5px 0;
    border-radius: 4px; box-shadow: 0 8px 18px var(--shadow);
  }
  #tA { rotate: -2deg; }
  #tB { rotate: 2deg; }
  .poster img { display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: cover; object-position: top; border-radius: 2px; background: var(--surface-2); }
  .poster figcaption { padding: 5px 2px 7px; display: flex; flex-direction: column; gap: 1px; min-height: 3.5em; }
  .poster figcaption b { font: 600 0.82rem/1.15 "Oswald", sans-serif; letter-spacing: 0.05em; text-transform: uppercase; }
  .poster figcaption span { font-size: 0.82rem; color: var(--muted); }
  .poster .qbox {
    aspect-ratio: 2 / 3; display: grid; place-items: center; border: 2px dashed var(--line); border-radius: 2px;
    font-family: "Mrs Saint Delafield", cursive; font-size: 6rem; color: var(--muted);
  }
  .poster.land { animation: land 0.22s ease-out; }
  @keyframes land { from { scale: 0.94; } to { scale: 1; } }

  .spinrow { display: flex; align-items: center; gap: 12px; }
  .round { color: var(--muted); font-size: 0.9rem; }

  /* secret cards */
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
  .card header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .ru-btn {
    font: 600 0.78rem "Jost", sans-serif; background: transparent; color: var(--muted);
    border: 1.5px solid var(--line); border-radius: 8px; padding: 1px 8px; cursor: pointer;
  }
  .ru-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .hold {
    flex: 1; min-height: 120px; display: flex; align-items: center; justify-content: center; text-align: center;
    border: 2px dashed var(--accent); border-radius: 10px; padding: 10px; font: inherit; color: var(--ink); cursor: pointer;
    background: repeating-linear-gradient(135deg, var(--surface-2) 0 2px, transparent 2px 12px);
    touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .cover b { display: block; font-family: "Mrs Saint Delafield", cursive; font-weight: 400; font-size: 2rem; line-height: 1; }
  .cover small { color: var(--muted); font-size: 0.85rem; }
  .goal { display: none; text-align: left; font-size: 1rem; line-height: 1.38; }
  .ru { display: none; margin-top: 8px; color: var(--muted); font-size: 0.93rem; }
  .card.peek .hold, .card.revealed .hold { background: var(--surface-2); border: 2px solid var(--star); cursor: default; }
  .card.peek .cover, .card.revealed .cover { display: none; }
  .card.peek .goal, .card.revealed .goal { display: block; }
  .card.ru-on .ru { display: block; }

  /* timer and finish */
  .talkbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 12px; }
  .clock { font: 600 2rem/1 "Oswald", sans-serif; font-variant-numeric: tabular-nums; min-width: 4.2ch; }
  .clock.done { color: var(--star); }
  .talkbar .btn { padding: 6px 14px; }
  .talkbar .end { margin-left: auto; }
  .awards { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .awards .btn { padding: 6px 14px; }
  .awards .btn[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }

  /* phrasebook: compact two-column strip */
  .book { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 10px 14px 14px; }
  .bookhead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 16px; margin-bottom: 8px; }
  .count { margin: 0; color: var(--muted); font-size: 0.88rem; }
  .count b { color: var(--ink); }
  .plist { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
  .prow { display: flex; gap: 6px; align-items: stretch; min-width: 0; }
  .pmain {
    flex: 1; min-width: 0; text-align: left; font: inherit; color: var(--ink); background: var(--bg);
    border: 1.5px solid var(--line); border-radius: 10px; padding: 4px 10px; display: block; cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .prow.power .pmain { border: 2px dashed var(--star); }
  .pen { display: block; font-weight: 600; font-size: 0.95rem; line-height: 1.25; }
  .prow.power .pen::before { content: "⭐ "; }
  .pex { display: block; color: var(--muted); font-size: 0.86rem; line-height: 1.25; }
  .pnote { color: var(--accent); font-size: 0.76rem; font-style: italic; }
  button.pmain[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--on-ok); border-style: solid; }
  button.pmain[aria-pressed="true"] .pex, button.pmain[aria-pressed="true"] .pnote { color: var(--on-ok); }
  button.pmain[aria-pressed="true"] .pen::before { content: "✓ "; }
  .prow.power button.pmain[aria-pressed="true"] .pen::before { content: "⭐ ✓ "; }

  /* footer */
  footer { margin-top: 24px; padding-top: 12px; border-top: 1.5px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; color: var(--muted); font-size: 0.9rem; }
  footer input {
    font: 500 0.95rem "Jost", sans-serif; color: var(--ink); background: var(--surface);
    border: 1.5px solid var(--line); border-radius: 8px; padding: 5px 10px; width: 8.5em;
  }
  footer .btn { padding: 6px 14px; font-size: 0.9rem; margin-left: auto; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 760px) {
    .table { grid-template-columns: 1fr; }
    .poster { width: min(138px, 40vw); }
    .plist { grid-template-columns: 1fr; }
    .cards { grid-template-columns: 1fr; }
    .stat { padding: 0 12px; min-width: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <svg class="arcs" viewBox="0 0 400 400" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" aria-hidden="true">
    <circle cx="400" cy="0" r="70"/>
    <circle cx="400" cy="0" r="115"/>
    <circle cx="400" cy="0" r="160"/>
    <circle cx="400" cy="0" r="205"/>
    <circle cx="400" cy="0" r="250"/>
    <circle cx="400" cy="0" r="295"/>
  </svg>

  <header class="top">
    <h1>Movie night</h1>
    <div class="stickies">
      <div class="sticky" id="tPlace"></div>
      <div class="sticky" id="tPower"></div>
    </div>
    <div class="spinrow">
      <button class="btn primary big" id="spin">Spin</button>
      <span class="round" id="roundLabel"></span>
    </div>
    <div class="board" aria-label="Scores">
      <div class="stat"><b id="sStars">0</b><span>Team stars</span></div>
      <div class="stat"><b id="sA">0</b><span class="nameA">Teacher</span></div>
      <div class="stat"><b id="sB">0</b><span class="nameB">Student</span></div>
    </div>
  </header>

  <main class="stage" id="stage">

    <section class="table" aria-label="The game">
      <div class="left-col">
        <div class="choice">
          <figure class="poster" id="tA"></figure>
          <span class="or">or</span>
          <figure class="poster" id="tB"></figure>
        </div>
      </div>

      <div id="after" hidden>
        <div class="cards">
          <article class="card" id="cardA">
            <header>
              <h3 class="nameA">Teacher</h3>
              <button class="ru-btn" aria-pressed="false" aria-label="Show Russian hint">RU</button>
            </header>
            <button class="hold" aria-label="Hold to read the secret goal">
              <span class="cover"><b>Hold to look</b><small>Your friend looks away</small></span>
              <span class="goal"><span class="en"></span><span class="ru"></span></span>
            </button>
          </article>
          <article class="card" id="cardB">
            <header>
              <h3 class="nameB">Student</h3>
              <button class="ru-btn" aria-pressed="false" aria-label="Show Russian hint">RU</button>
            </header>
            <button class="hold" aria-label="Hold to read the secret goal">
              <span class="cover"><b>Hold to look</b><small>Your friend looks away</small></span>
              <span class="goal"><span class="en"></span><span class="ru"></span></span>
            </button>
          </article>
        </div>

        <div class="talkbar">
          <output class="clock" id="clock">3:00</output>
          <button class="btn" id="tStart">Start talking</button>
          <button class="btn ghost" id="tReset">Reset</button>
          <button class="btn primary end" id="reveal">Reveal and guess</button>
        </div>
        <div class="awards" id="awards" hidden>
          <button class="btn ghost" id="gA" aria-pressed="false"><span class="nameA">Teacher</span> guessed it (+1)</button>
          <button class="btn ghost" id="gB" aria-pressed="false"><span class="nameB">Student</span> guessed it (+1)</button>
          <button class="btn" id="next">Next round</button>
        </div>
      </div>
    </section>

    <section id="phrases" aria-label="Phrasebook" hidden>
      <div class="book">
        <div class="bookhead">
          <h2>Phrasebook</h2>
          <p class="count" id="count"></p>
        </div>
        <div class="plist" id="chips"></div>
      </div>
    </section>

  </main>

  <footer>
    <span>Players:</span>
    <input id="inA" type="text" maxlength="14" value="Teacher" aria-label="Name of player 1">
    <span>and</span>
    <input id="inB" type="text" maxlength="14" value="Student" aria-label="Name of player 2">
    <button class="btn ghost" id="restart">Start over</button>
  </footer>

  <p class="sr" id="status" aria-live="polite"></p>
</div>

  var PLACES = [
    { en: "On the sofa at home",  em: "🛋️" },
    { en: "At the cinema",        em: "🍿" },
    { en: "On a long flight",     em: "✈️" },
    { en: "On a rainy Sunday",    em: "🌧️" },
    { en: "At a sleepover",       em: "🌙" },
    { en: "At a birthday party",  em: "🎂" },
    { en: "On a school trip bus", em: "🚌" },
    { en: "In a holiday hotel",   em: "🏨" }
  ];

  var PHRASES = [
    { id: "want",     en: "What do you want to watch?" },
    { id: "ratherq",  en: "Would you rather …?" },
    { id: "preferq",  en: "Would you prefer …?" },
    { id: "rather",   en: "I’d rather …" },
    { id: "prefer",   en: "I’d prefer to …" },
    { id: "mind",     en: "I don’t mind." },
    { id: "better",   en: "Maybe … is a better idea." },
    { id: "fun",      en: "It sounds more fun / interesting than …" }
  ];

  // m = my movie, o = my friend's movie, t = a third movie
  var GOALS = [
    { id: "champion", strong: true,
      en: function (m) { return "You really want to watch " + m.name + ". Give two reasons why!"; },
      ru: function (m) { return "Ты очень хочешь посмотреть «" + m.name + "». Назови две причины!"; } },
    { id: "boss", strong: true,
      en: function (m) { return "It’s your turn to choose tonight, so you want to win with " + m.name + "! Don’t agree too fast, but stay friendly."; },
      ru: function (m) { return "Сегодня твоя очередь выбирать, и ты хочешь победить с «" + m.name + "»! Не соглашайся слишком быстро, но оставайся дружелюбным."; } },
    { id: "hater", strong: true,
      en: function (m, o) { return "You don’t like " + o.name + " at all. Be polite, but say why it’s a bad idea."; },
      ru: function (m, o) { return "Тебе совсем не нравится «" + o.name + "». Вежливо объясни, почему это плохая идея."; } },
    { id: "newidea", strong: true,
      en: function (m, o, t) { return m.name + " and " + o.name + " both sound boring to you. Suggest " + t.name + " instead!"; },
      ru: function (m, o, t) { return "Оба варианта кажутся тебе скучными. Предложи «" + t.name + "»!"; } },
    { id: "peace",
      en: function () { return "You don’t mind what you watch. You just want your friend to be happy. Ask lots of questions!"; },
      ru: function () { return "Тебе всё равно, что смотреть. Ты хочешь, чтобы другу было хорошо. Задавай много вопросов!"; } },
    { id: "short",
      en: function () { return "You only have 40 minutes tonight. You need something short, like one episode of a series."; },
      ru: function () { return "У тебя только 40 минут. Тебе нужно что-то короткое, например одна серия сериала."; } },
    { id: "deal",
      en: function () { return "You want a deal: one film tonight and the other one tomorrow. Make it happen!"; },
      ru: function () { return "Ты хочешь договориться: один фильм сегодня, другой завтра. Добейся этого!"; } },
    { id: "scared",
      en: function () { return "You get scared very easily. Try to find something that is not scary."; },
      ru: function () { return "Ты легко пугаешься. Постарайся выбрать что-нибудь нестрашное."; } }
  ];

  /* ---------- random helpers ---------- */
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var x = a[i]; a[i] = a[j]; a[j] = x;
    }
    return a;
  }

  function buildRound() {
    var place = pick(PLACES);
    var cartoons = POSTERS.filter(function (p) { return p.tag === "animation"; });
    var films = POSTERS.filter(function (p) { return p.tag !== "animation"; });
    // the student’s movie is usually a cartoon, sometimes a film
    var B = Math.random() < 0.75 ? pick(cartoons) : pick(films);
    // the teacher’s movie is usually a different kind, so the choice is real
    var A = B.tag === "animation"
      ? pick(films)
      : pick(POSTERS.filter(function (p) { return p.id !== B.id && p.tag !== B.tag; }));
    // the third movie (for “suggest something else”) is usually a cartoon too
    var restPool = POSTERS.filter(function (p) { return p.id !== A.id && p.id !== B.id; });
    var restCartoons = restPool.filter(function (p) { return p.tag === "animation"; });
    var T = (Math.random() < 0.7 && restCartoons.length) ? pick(restCartoons) : pick(restPool);
    var power = pick(PHRASES);
    var strong = pick(GOALS.filter(function (x) { return x.strong; }));
    var other = pick(GOALS.filter(function (x) { return x.id !== strong.id; }));
    // the student gets the “strong” goal (love a movie, suggest one) most of the time
    var strongToA = Math.random() < 0.3;
    var goalA = strongToA ? strong : other;
    var goalB = strongToA ? other : strong;
    return {
      place: place, pA: A, pB: B, pT: T, power: power,
      textA: { en: goalA.en(A, B, T), ru: goalA.ru(A, B, T) },
      textB: { en: goalB.en(B, A, T), ru: goalB.ru(B, A, T) }
    };
  }

  /* ---------- state ---------- */
  var state = {
    round: 0, setup: null, used: {}, revealed: false,
    guessed: { A: false, B: false }, scores: { A: 0, B: 0 }, banked: 0,
    names: { A: "Teacher", B: "Student" }
  };
  var spinning = false;

  try {
    var saved = JSON.parse(localStorage.getItem("movienight-names") || "null");
    if (saved && saved.A && saved.B) { state.names.A = saved.A; state.names.B = saved.B; }
  } catch (e) { /* storage can be empty or blocked */ }

  /* ---------- tiles ---------- */
  function paintPoster(el, p) {
    el.innerHTML = '<img alt=""><figcaption><b></b><span></span></figcaption>';
    el.querySelector("img").src = p.img;
    el.querySelector("b").textContent = p.name;
    el.querySelector("span").textContent = p.tag;
  }
  function paintQuestionPoster(el) {
    el.innerHTML = '<div class="qbox" aria-hidden="true">?</div><figcaption><b>Spin to find out</b><span>&nbsp;</span></figcaption>';
  }
  function paintSticky(el, o) {
    el.innerHTML = '<span class="em" aria-hidden="true"></span><span><span class="s"></span><span class="t"></span></span>';
    el.querySelector(".em").textContent = o.em;
    el.querySelector(".s").textContent = o.label;
    el.querySelector(".t").textContent = o.t;
  }
  function placeNote(p) { return { em: p.em, label: "Where", t: p.en }; }
  function powerNote(p) { return { em: "⭐", label: "Bonus phrase", t: p.en }; }

  function resetTiles() {
    paintQuestionPoster($("#tA"));
    paintQuestionPoster($("#tB"));
    paintSticky($("#tPlace"), { em: "❓", label: "Where", t: "Spin to find out" });
    paintSticky($("#tPower"), { em: "⭐", label: "Bonus phrase", t: "Spin to find out" });
  }

  function land(el) {
    el.classList.remove("land");
    void el.offsetWidth;
    el.classList.add("land");
  }

  /* ---------- names, scores ---------- */
  function applyNames() {
    $$(".nameA").forEach(function (e) { e.textContent = state.names.A; });
    $$(".nameB").forEach(function (e) { e.textContent = state.names.B; });
    try { localStorage.setItem("movienight-names", JSON.stringify(state.names)); } catch (e) { /* ignore */ }
  }

  function roundStars() {
    var n = Object.keys(state.used).length;
    if (state.setup && state.used[state.setup.power.id]) n += 1;
    return n;
  }
  function updateScore() {
    $("#sStars").textContent = state.banked + roundStars();
    $("#sA").textContent = state.scores.A;
    $("#sB").textContent = state.scores.B;
    var used = Object.keys(state.used).length;
    $("#count").innerHTML = "<b>" + used + " of " + PHRASES.length + "</b> used, " + roundStars() + " ⭐ this round. Tap a phrase when you say it.";
  }

  /* ---------- phrases ---------- */
  // ready-made example sentences, built from tonight’s movies
  function example(id, s) {
    switch (id) {
      case "want":    return "What do you want to watch tonight?";
      case "ratherq": return "Would you rather watch " + s.pA.name + " or " + s.pB.name + "?";
      case "preferq": return "Would you prefer to watch " + s.pA.name + " or " + s.pB.name + "?";
      case "rather":  return "I’d rather watch " + s.pB.name + ".";
      case "prefer":  return "I’d prefer to watch " + s.pA.name + ".";
      case "mind":    return "I don’t mind. You choose!";
      case "better":  return "Maybe " + s.pT.name + " is a better idea.";
      default:        return "It sounds more interesting than " + s.pB.name + ".";
    }
  }
  var NOTES = { rather: "no “to” after rather", prefer: "use “to” after prefer" };

  function phraseRow(p) {
    var s = state.setup;
    var ex = example(p.id, s);
    var wrap = document.createElement("div");
    wrap.className = "prow" + (s.power.id === p.id ? " power" : "");
    var main = document.createElement("button");
    main.type = "button";
    main.className = "pmain";
    main.innerHTML = '<span class="pen"></span><span class="pex"></span>';
    main.querySelector(".pen").textContent = p.en;
    main.querySelector(".pex").textContent = ex;
    if (NOTES[p.id]) {
      var note = document.createElement("span");
      note.className = "pnote";
      note.textContent = "  (" + NOTES[p.id] + ")";
      main.querySelector(".pen").appendChild(note);
    }
    main.setAttribute("aria-pressed", state.used[p.id] ? "true" : "false");
    main.addEventListener("click", function () {
      if (state.used[p.id]) { delete state.used[p.id]; } else { state.used[p.id] = true; }
      main.setAttribute("aria-pressed", state.used[p.id] ? "true" : "false");
      updateScore();
    });
    wrap.appendChild(main);
    return wrap;
  }

  function renderChips() {
    var box = $("#chips");
    box.innerHTML = "";
    PHRASES.forEach(function (p) { box.appendChild(phraseRow(p)); });
  }

  /* ---------- cards ---------- */
  function fillCard(id, text) {
    var card = $(id);
    card.querySelector(".en").textContent = text.en;
    card.querySelector(".ru").textContent = text.ru;
    card.classList.remove("peek", "revealed", "ru-on");
    card.querySelector(".ru-btn").setAttribute("aria-pressed", "false");
  }

  function bindPeek(card) {
    var btn = card.querySelector(".hold");
    var on = function () { card.classList.add("peek"); };
    var off = function () { card.classList.remove("peek"); };
    btn.addEventListener("pointerdown", function (e) { e.preventDefault(); on(); });
    ["pointerup", "pointerleave", "pointercancel", "blur"].forEach(function (ev) { btn.addEventListener(ev, off); });
    btn.addEventListener("keydown", function (e) { if (e.key === " " || e.key === "Enter") { e.preventDefault(); on(); } });
    btn.addEventListener("keyup", function (e) { if (e.key === " " || e.key === "Enter") { off(); } });
    btn.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    var ru = card.querySelector(".ru-btn");
    ru.addEventListener("click", function () {
      var onNow = card.classList.toggle("ru-on");
      ru.setAttribute("aria-pressed", onNow ? "true" : "false");
    });
  }

  /* ---------- timer ---------- */
  var TOTAL = 180, left = TOTAL, timerId = null;
  function fmt(s) { return Math.floor(s / 60) + ":" + (s % 60 < 10 ? "0" : "") + (s % 60); }
  function showClock() {
    var c = $("#clock");
    c.textContent = left > 0 ? fmt(left) : "Time’s up!";
    c.classList.toggle("done", left === 0);
  }
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } $("#tStart").textContent = left === TOTAL ? "Start talking" : "Continue"; }
  function resetTimer() { stopTimer(); left = TOTAL; showClock(); $("#tStart").textContent = "Start talking"; }
  function toggleTimer() {
    if (timerId) { stopTimer(); return; }
    if (left === 0) { left = TOTAL; }
    $("#tStart").textContent = "Pause";
    timerId = setInterval(function () {
      left -= 1;
      showClock();
      if (left <= 0) {
        stopTimer();
        $("#tStart").textContent = "Start talking";
        $("#status").textContent = "Time is up. Time to guess your friend’s goal!";
      }
    }, 1000);
    showClock();
  }

  /* ---------- rounds ---------- */
  function resetRoundState() {
    state.used = {};
    state.revealed = false;
    state.guessed = { A: false, B: false };
    $("#awards").hidden = true;
    $("#reveal").disabled = false;
    ["#gA", "#gB"].forEach(function (id) { $(id).setAttribute("aria-pressed", "false"); });
    resetTimer();
  }

  function spin() {
    if (spinning) return;
    spinning = true;
    $("#spin").disabled = true;

    if (state.setup) { state.banked += roundStars(); }
    state.round += 1;
    state.setup = buildRound();
    resetRoundState();

    var s = state.setup;
    var jobs = [
      { el: $("#tPlace"), list: PLACES, paint: function (el, p) { paintSticky(el, placeNote(p)); }, final: s.place, stop: 650 },
      { el: $("#tA"), list: POSTERS, paint: paintPoster, final: s.pA, stop: 1000 },
      { el: $("#tB"), list: POSTERS, paint: paintPoster, final: s.pB, stop: 1350 },
      { el: $("#tPower"), list: PHRASES, paint: function (el, p) { paintSticky(el, powerNote(p)); }, final: s.power, stop: 1700 }
    ];
    var finished = 0;

    function done() {
      spinning = false;
      $("#spin").disabled = false;
      $("#spin").textContent = "Spin again";
      $("#spin").classList.remove("big");
      $("#roundLabel").textContent = "Round " + state.round;
      fillCard("#cardA", s.textA);
      fillCard("#cardB", s.textB);
      renderChips();
      updateScore();
      $("#after").hidden = false;
      $("#phrases").hidden = false;
      $("#status").textContent = "Round " + state.round + ". " + s.place.en + ". " + s.pA.name + " or " + s.pB.name + ". Bonus phrase: " + s.power.en;
    }

    jobs.forEach(function (j) {
      if (reduced) {
        j.paint(j.el, j.final);
        finished += 1;
        if (finished === jobs.length) done();
        return;
      }
      var iv = setInterval(function () {
        j.paint(j.el, j.list[Math.floor(Math.random() * j.list.length)]);
      }, 90);
      setTimeout(function () {
        clearInterval(iv);
        j.paint(j.el, j.final);
        land(j.el);
        finished += 1;
        if (finished === jobs.length) done();
      }, j.stop);
    });
  }

  /* ---------- wiring ---------- */
  $("#spin").addEventListener("click", spin);

  bindPeek($("#cardA"));
  bindPeek($("#cardB"));

  $("#tStart").addEventListener("click", toggleTimer);
  $("#tReset").addEventListener("click", resetTimer);

  $("#reveal").addEventListener("click", function () {
    state.revealed = true;
    $("#cardA").classList.add("revealed");
    $("#cardB").classList.add("revealed");
    $("#awards").hidden = false;
    $("#reveal").disabled = true;
    stopTimer();
  });

  function bindGuess(btnId, who) {
    var btn = $(btnId);
    btn.addEventListener("click", function () {
      state.guessed[who] = !state.guessed[who];
      state.scores[who] += state.guessed[who] ? 1 : -1;
      btn.setAttribute("aria-pressed", state.guessed[who] ? "true" : "false");
      updateScore();
    });
  }
  bindGuess("#gA", "A");
  bindGuess("#gB", "B");

  $("#next").addEventListener("click", function () {
    spin();
    window.scrollTo(0, 0);
  });

  $("#inA").addEventListener("input", function (e) { state.names.A = e.target.value.trim() || "Player 1"; applyNames(); });
  $("#inB").addEventListener("input", function (e) { state.names.B = e.target.value.trim() || "Player 2"; applyNames(); });

  var restartArmed = null;
  $("#restart").addEventListener("click", function () {
    var btn = $("#restart");
    if (!restartArmed) {
      btn.textContent = "Sure? Tap again";
      restartArmed = setTimeout(function () { btn.textContent = "Start over"; restartArmed = null; }, 3000);
      return;
    }
    clearTimeout(restartArmed); restartArmed = null;
    btn.textContent = "Start over";
    state.round = 0; state.setup = null; state.banked = 0; state.scores = { A: 0, B: 0 };
    state.used = {};
    resetTimer();
    $("#after").hidden = true;
    $("#phrases").hidden = true;
    $("#roundLabel").textContent = "";
    $("#spin").textContent = "Spin";
    $("#spin").classList.add("big");
    resetTiles();
    updateScore();
    window.scrollTo(0, 0);
  });

  /* ---------- start ---------- */
  $("#inA").value = state.names.A;
  $("#inB").value = state.names.B;
  applyNames();
  resetTiles();
  updateScore();
})();
</script>
</body>
</html>
